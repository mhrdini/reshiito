[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shared"  # wheel/package name
version = "0.1.0"
description = "Shared config for OCR and API"
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["shared"]
package-dir = {"" = "."}